name: Deploy Download PWA

on:
  push:
    branches:
      - main
    paths:
      - "download-site/**"
      - ".github/workflows/deploy-download-site.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Publish HomePilot release hub
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Copy production app icon
        run: cp assets/brand/homepilot-app-icon.png download-site/assets/homepilot-app-icon.png

      - name: Upload PWA artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: download-site

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
