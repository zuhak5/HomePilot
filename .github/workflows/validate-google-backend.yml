name: Validate Google Backend and Release Contracts

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: homepilot-google-backend-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deno-security:
    name: Deno SSV tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: "2.9.3"
      - name: Verify Deno formatting
        run: >-
          deno fmt --check
          supabase/functions/admob-ssv-handler/index.ts
          supabase/functions/admob-ssv-handler/index_test.ts
          supabase/functions/delete-account/index.ts
          supabase/functions/delete-account/index_test.ts
          supabase/functions/account-deletion-status/index.ts
          supabase/functions/account-deletion-status/index_test.ts
      - name: Type-check locked Edge Functions
        run: |
          cd supabase/functions/admob-ssv-handler && deno install --frozen && cd ../../..
          cd supabase/functions/delete-account && deno install --frozen && cd ../../..
          cd supabase/functions/account-deletion-status && deno install --frozen && cd ../../..
          cd supabase/functions/admob-ssv-handler && deno check --frozen index.ts && cd ../../..
          cd supabase/functions/delete-account && deno check --frozen index.ts && cd ../../..
          cd supabase/functions/account-deletion-status && deno check --frozen index.ts && cd ../../..
      - name: Test locked Edge Functions
        run: |
          cd supabase/functions/admob-ssv-handler && deno test --frozen --allow-env --allow-net index_test.ts && cd ../../..
          cd supabase/functions/delete-account && deno test --frozen --allow-env --allow-net index_test.ts && cd ../../..
          cd supabase/functions/account-deletion-status && deno test --frozen --allow-env --allow-net index_test.ts && cd ../../..

  web-and-static-contracts:
    name: Google contract/static checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Test account deletion browser flow
        run: >-
          node --test
          tool/account-deletion-site.test.mjs
          tool/release-workflows.test.mjs
      - name: Validate Google and Android contracts
        run: node tool/validate_google_release_contracts.mjs

  database-security:
    name: Supabase database tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Start local Supabase stack
        run: npx supabase start
      - name: Lint database schema
        run: npm run supabase:lint
      - name: Run database authorization and monetization tests
        run: npm run supabase:test
      - name: Stop local Supabase stack
        if: always()
        run: npx supabase stop --no-backup

  hosted-advisors:
    name: Hosted Supabase Advisors
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
      - name: Query hosted security and performance advisors
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ADVISOR_REPORT: artifacts/supabase-advisors.json
        run: node tool/audit_supabase_advisors.mjs
      - name: Upload sanitized advisor evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: supabase-advisors-${{ github.sha }}
          path: artifacts/supabase-advisors.json
          if-no-files-found: error
          retention-days: 14
