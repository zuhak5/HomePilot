name: Restart Production Build Once

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/restart-production-once.yml"

permissions:
  actions: write
  contents: write

concurrency:
  group: restart-production-build-once
  cancel-in-progress: false

jobs:
  restart-production:
    name: Cancel stale build and dispatch verified release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      STALE_RUN_ID: "31117784968"
      EXPECTED_VERSION: "1.4.2+27"
      EXPECTED_TAG: "v1.4.2-build.27"
      CHANGELOG: |-
        ## Release 1.4.2 (Build 27)

        ### Fixed & Improved
        - Reduced reward-claim REST traffic by replacing continuous polling with a one-shot query.
        - Added structured diagnostics and automatic abandonment for stale failed outbox mutations.
        - Completed AdMob Firebase Analytics integration.
        - Added structured AdMob lifecycle logging.
        - Added the network request usage audit.
        - Improved VersionDeck deployment reliability with current GitHub Pages actions, serialized publishing, and extended deployment polling.

    steps:
      - name: Check out current main
        uses: actions/checkout@v6
        with:
          ref: refs/heads/main
          fetch-depth: 0

      - name: Verify version and unused release tag
        shell: bash
        run: |
          set -euo pipefail

          local_sha="$(git rev-parse HEAD)"
          remote_sha="$(gh api "/repos/${GITHUB_REPOSITORY}/commits/main" --jq '.sha')"
          test "$local_sha" = "$remote_sha"

          actual_version="$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml | head -n 1 | tr -d '\r')"
          if [[ "$actual_version" != "$EXPECTED_VERSION" ]]; then
            echo "Expected version $EXPECTED_VERSION, found $actual_version." >&2
            exit 1
          fi

          if gh api "/repos/${GITHUB_REPOSITORY}/releases/tags/${EXPECTED_TAG}" >/dev/null 2>&1; then
            echo "Release tag already exists: $EXPECTED_TAG" >&2
            exit 1
          fi

          echo "Verified $EXPECTED_VERSION at $local_sha; $EXPECTED_TAG is unused."

      - name: Cancel stale production run
        shell: bash
        run: |
          set -euo pipefail

          run_path="/repos/${GITHUB_REPOSITORY}/actions/runs/${STALE_RUN_ID}"
          status="$(gh api "$run_path" --jq '.status')"

          if [[ "$status" != "completed" ]]; then
            gh api --method POST "$run_path/cancel" >/dev/null
          fi

          for attempt in $(seq 1 30); do
            status="$(gh api "$run_path" --jq '.status')"
            conclusion="$(gh api "$run_path" --jq '.conclusion // ""')"
            if [[ "$status" == "completed" ]]; then
              echo "Stale run stopped with conclusion: ${conclusion:-unknown}."
              exit 0
            fi
            sleep 2
          done

          echo "Stale run did not stop within the cancellation window." >&2
          exit 1

      - name: Remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/restart-production-once.yml
          git commit -m "chore: remove one-shot production restart workflow"
          git push origin HEAD:main

      - name: Dispatch verified production build
        shell: bash
        run: |
          set -euo pipefail

          main_sha="$(gh api "/repos/${GITHUB_REPOSITORY}/commits/main" --jq '.sha')"
          actual_version="$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml | head -n 1 | tr -d '\r')"
          test "$actual_version" = "$EXPECTED_VERSION"

          jq -n \
            --arg ref "main" \
            --arg changelog "$CHANGELOG" \
            '{ref: $ref, inputs: {changelog: $changelog}}' \
            | gh api \
                --method POST \
                "/repos/${GITHUB_REPOSITORY}/actions/workflows/build-production-android.yml/dispatches" \
                --input -

          echo "Dispatched Build Production APK for $EXPECTED_VERSION from main $main_sha."
          echo "### Production restart" >> "$GITHUB_STEP_SUMMARY"
          echo "- Cancelled stale run: $STALE_RUN_ID" >> "$GITHUB_STEP_SUMMARY"
          echo "- Version: $EXPECTED_VERSION" >> "$GITHUB_STEP_SUMMARY"
          echo "- Tag: $EXPECTED_TAG" >> "$GITHUB_STEP_SUMMARY"
          echo "- Source: $main_sha" >> "$GITHUB_STEP_SUMMARY"
