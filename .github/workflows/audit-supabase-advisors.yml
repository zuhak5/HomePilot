name: Audit Supabase Advisors

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-advisors-${{ github.ref }}
  cancel-in-progress: false

jobs:
  advisors:
    name: Hosted security and performance advisors
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
      - name: Query hosted Supabase Advisors
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ADVISOR_REPORT: artifacts/supabase-advisors.json
        run: node tool/audit_supabase_advisors.mjs
      - name: Upload sanitized advisor evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: supabase-advisors-${{ github.sha }}
          path: artifacts/supabase-advisors.json
          if-no-files-found: error
          retention-days: 14
