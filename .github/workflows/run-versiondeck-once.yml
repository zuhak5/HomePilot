name: Run VersionDeck Once

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/run-versiondeck-once.yml"

permissions:
  actions: write
  contents: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Remove one-shot workflow
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          self_path='.github/workflows/run-versiondeck-once.yml'
          self_sha="$(gh api "repos/${GITHUB_REPOSITORY}/contents/${self_path}?ref=main" --jq .sha)"
          gh api --method DELETE "repos/${GITHUB_REPOSITORY}/contents/${self_path}" \
            -f message='chore: remove one-shot VersionDeck dispatcher' \
            -f sha="$self_sha" \
            -f branch='main'

      - name: Dispatch Deploy VersionDeck
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/deploy-download-site.yml/dispatches" \
            -f ref='main'
          echo 'Deploy VersionDeck dispatched from main.'
