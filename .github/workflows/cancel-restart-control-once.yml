name: Cancel Stalled Production Restart Once

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/cancel-restart-control-once.yml"

concurrency:
  group: restart-production-build-once
  cancel-in-progress: true

jobs:
  cancel-only:
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "This job is intentionally skipped."
