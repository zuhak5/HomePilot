name: Validate Flutter

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: homepilot-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Format, analyze, and test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.7"
          channel: stable
          cache: true

      - name: Show tool versions
        run: |
          flutter --version
          dart --version
          pwsh --version

      - name: Resolve dependencies
        run: flutter pub get

      - name: Generate localization files
        run: flutter gen-l10n

      - name: Generate source files
        run: dart run build_runner build

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Parse production PowerShell scripts
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          foreach ($Script in @(
            "tool/build_prod.ps1",
            "tool/publish_sentry_release.ps1"
          )) {
            $Tokens = $null
            $Errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Join-Path $PWD $Script),
              [ref]$Tokens,
              [ref]$Errors
            ) | Out-Null
            if ($Errors.Count -gt 0) {
              $Errors | ForEach-Object { Write-Error $_.Message }
              throw "PowerShell parsing failed for $Script."
            }
          }

      - name: Analyze
        run: flutter analyze --no-pub

      - name: Run tests
        shell: bash
        run: |
          set -o pipefail
          flutter test \
            --no-pub \
            --concurrency=1 \
            --timeout 3m \
            --reporter expanded \
            --exclude-tags production-config \
            2>&1 | tee flutter-test-output.log

      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-test-output
          path: flutter-test-output.log
          if-no-files-found: warn
          retention-days: 7

      - name: Validate production configuration schema
        run: >-
          flutter test
          --no-pub
          test/prod_build_config_test.dart
          --dart-define-from-file=config/prod.example.json
          --dart-define=VERIFY_PRODUCTION_CONFIG=true
