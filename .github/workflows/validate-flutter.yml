name: Validate Flutter

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: homepilot-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Format, analyze, and test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.7"
          channel: stable
          cache: true

      - name: Show tool versions
        run: |
          flutter --version
          dart --version

      - name: Resolve dependencies
        run: flutter pub get

      - name: Generate localization files
        run: flutter gen-l10n

      - name: Generate source files
        run: dart run build_runner build

      - name: Apply canonical Dart formatting
        run: dart format lib test

      - name: Commit one-time branch formatting
        if: github.event_name == 'pull_request' && github.head_ref == 'codex/sentry-observability'
        run: |
          if git diff --quiet -- lib test; then
            echo "Dart sources are already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib test
          git commit -m "Apply canonical Dart formatting"
          git push origin HEAD:${{ github.head_ref }}

      - name: Verify formatting
        run: git diff --exit-code -- lib test

      - name: Analyze
        run: flutter analyze --no-pub

      - name: Run tests
        run: >-
          flutter test
          --no-pub
          --concurrency=1
          --timeout 3m
          --exclude-tags production-config

      - name: Validate production configuration schema
        run: >-
          flutter test
          --no-pub
          test/prod_build_config_test.dart
          --dart-define-from-file=config/prod.example.json
          --dart-define=VERIFY_PRODUCTION_CONFIG=true
