name: Validate Flutter

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: homepilot-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Format, analyze, and test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.7"
          channel: stable
          cache: true

      - name: Show tool versions
        run: |
          flutter --version
          dart --version

      - name: Resolve dependencies
        run: flutter pub get

      - name: Generate localization files
        run: flutter gen-l10n

      - name: Generate source files
        run: dart run build_runner build

      - name: Apply canonical Dart formatting
        run: dart format lib test

      - name: Upload formatted sources for correction
        uses: actions/upload-artifact@v7
        with:
          name: HomePilot-formatted-Dart-${{ github.run_number }}
          path: |
            lib
            test
          if-no-files-found: error
          retention-days: 1

      - name: Verify formatting
        run: git diff --exit-code -- lib test

      - name: Analyze
        run: flutter analyze --no-pub

      - name: Run tests
        run: >-
          flutter test
          --no-pub
          --concurrency=1
          --timeout 3m
          --exclude-tags production-config

      - name: Validate production configuration schema
        run: >-
          flutter test
          --no-pub
          test/prod_build_config_test.dart
          --dart-define-from-file=config/prod.example.json
          --dart-define=VERIFY_PRODUCTION_CONFIG=true
