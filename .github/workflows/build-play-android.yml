name: Build Play Store AAB

on:
  workflow_dispatch:
    inputs:
      release_notes:
        description: "Google Play internal track release notes"
        required: false
        type: string

concurrency:
  group: homepilot-play-release
  cancel-in-progress: false

jobs:
  build-play-aab:
    name: Build signed production AAB
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 60
    environment: production

    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Verify release commit belongs to main
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          git fetch origin main --no-tags
          git merge-base --is-ancestor $env:GITHUB_SHA origin/main
          if ($LASTEXITCODE -ne 0) {
            throw "Production releases must be built from a commit contained in origin/main."
          }

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.7"
          channel: stable
          cache: true

      - name: Create production config from secrets
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Path config -Force | Out-Null
          $config = @{
            APP_ENV = "prod"
            SUPABASE_URL = "${{ secrets.PROD_SUPABASE_URL }}"
            SUPABASE_PUBLISHABLE_KEY = "${{ secrets.PROD_SUPABASE_PUBLISHABLE_KEY }}"
            GOOGLE_WEB_CLIENT_ID = "${{ secrets.PROD_GOOGLE_WEB_CLIENT_ID }}"
            SENTRY_ENABLED = $true
            SENTRY_DSN = "${{ secrets.PROD_SENTRY_DSN }}"
            SENTRY_TRACES_SAMPLE_RATE = "0.2"
          }
          $config | ConvertTo-Json -Depth 5 | Set-Content -Path config/prod.json -Encoding UTF8

      - name: Create Android signing material from secrets
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          [System.IO.File]::WriteAllBytes(
            "android/app/release.jks",
            [System.Convert]::FromBase64String("${{ secrets.ANDROID_KEYSTORE_BASE64 }}")
          )
          @"
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          storeFile=release.jks
          "@ | Set-Content -Path android/key.properties -Encoding UTF8

      - name: Build production AAB
        shell: pwsh
        run: |
          .\tool\build_play_prod.ps1

      - name: Upload production AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: homepilot-production-aab
          path: build/app/outputs/bundle/prodRelease/app-release.aab
          if-no-files-found: error
