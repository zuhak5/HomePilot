name: Build Production APK

on:
  workflow_dispatch:
    inputs:
      changelog:
        description: "Release changelog in Markdown"
        required: true
        type: string

concurrency:
  group: homepilot-production-release
  cancel-in-progress: false

jobs:
  build-production-apk:
    name: Build signed production APK
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 60
    environment: production

    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Verify release commit belongs to main
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          git fetch origin main --no-tags
          git merge-base --is-ancestor $env:GITHUB_SHA origin/main
          if ($LASTEXITCODE -ne 0) {
            throw "Production releases must be built from a commit contained in origin/main."
          }

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.7"
          channel: stable
          cache: true

      - name: Show tool versions
        shell: pwsh
        run: |
          flutter --version
          dart --version
          java -version
          node --version
          npm --version

      - name: Prepare release metadata
        id: metadata
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $VersionLine = Get-Content "pubspec.yaml" |
            Where-Object { $_ -match '^version:\s*' } |
            Select-Object -First 1
          if (-not $VersionLine) {
            throw "Version was not found in pubspec.yaml."
          }

          $VersionValue = ($VersionLine -replace '^version:\s*', '').Trim()
          if ($VersionValue -notmatch '^(\d+\.\d+\.\d+)\+(\d+)$') {
            throw "Expected version format x.y.z+build, got: $VersionValue"
          }

          $VersionName = $Matches[1]
          $BuildNumber = $Matches[2]
          $Tag = "v$VersionName-build.$BuildNumber"
          $ReleaseName = "HomePilot $VersionName (Build $BuildNumber)"
          $ApkName = "HomePilot-$VersionName-build-$BuildNumber.apk"
          $SentryRelease = "com.homepilot.app@$VersionName+$BuildNumber"

          "version_name=$VersionName" >> $env:GITHUB_OUTPUT
          "build_number=$BuildNumber" >> $env:GITHUB_OUTPUT
          "tag=$Tag" >> $env:GITHUB_OUTPUT
          "release_name=$ReleaseName" >> $env:GITHUB_OUTPUT
          "apk_name=$ApkName" >> $env:GITHUB_OUTPUT
          "sentry_release=$SentryRelease" >> $env:GITHUB_OUTPUT
          "sentry_dist=$BuildNumber" >> $env:GITHUB_OUTPUT

          Write-Host "Prepared HomePilot $VersionName ($BuildNumber)."
          Write-Host "Prepared Sentry release $SentryRelease."

      - name: Create production configuration
        shell: pwsh
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
          GOOGLE_WEB_CLIENT_ID: ${{ vars.GOOGLE_WEB_CLIENT_ID }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
          SENTRY_DSN: ${{ vars.SENTRY_DSN }}
        run: |
          $ErrorActionPreference = "Stop"

          $RequiredVariables = @{
            SUPABASE_URL             = $env:SUPABASE_URL
            SUPABASE_PUBLISHABLE_KEY = $env:SUPABASE_PUBLISHABLE_KEY
            GOOGLE_WEB_CLIENT_ID     = $env:GOOGLE_WEB_CLIENT_ID
            SENTRY_ORG               = $env:SENTRY_ORG
            SENTRY_PROJECT           = $env:SENTRY_PROJECT
            SENTRY_DSN               = $env:SENTRY_DSN
          }

          foreach ($Item in $RequiredVariables.GetEnumerator()) {
            if ([string]::IsNullOrWhiteSpace($Item.Value)) {
              throw "Missing production variable: $($Item.Key)"
            }
          }
          if ($env:SENTRY_ORG -ne "homepilot-qt") {
            throw "SENTRY_ORG must be homepilot-qt."
          }
          if ($env:SENTRY_PROJECT -ne "homepilot") {
            throw "SENTRY_PROJECT must be homepilot."
          }

          try {
            $SentryUri = [System.Uri]$env:SENTRY_DSN
          }
          catch {
            throw "SENTRY_DSN must be a valid absolute URL."
          }
          if ($SentryUri.Scheme -ne "https" -or
              [string]::IsNullOrWhiteSpace($SentryUri.UserInfo) -or
              $SentryUri.Host -notmatch '(?i)(^|\.)ingest(?:\.[a-z0-9-]+)?\.sentry\.io$') {
            throw "SENTRY_DSN must be an HTTPS Sentry ingest URL."
          }

          $Config = [ordered]@{
            APP_ENV                   = "prod"
            SUPABASE_URL              = $env:SUPABASE_URL
            SUPABASE_PUBLISHABLE_KEY  = $env:SUPABASE_PUBLISHABLE_KEY
            GOOGLE_WEB_CLIENT_ID      = $env:GOOGLE_WEB_CLIENT_ID
            SENTRY_ENABLED            = $true
            SENTRY_DSN                = $env:SENTRY_DSN
            SENTRY_TRACES_SAMPLE_RATE = "0.05"
          } | ConvertTo-Json

          New-Item -ItemType Directory -Path "config" -Force | Out-Null
          $Utf8NoBom = New-Object System.Text.UTF8Encoding($false)
          [System.IO.File]::WriteAllText(
            (Join-Path $PWD "config\prod.json"),
            $Config,
            $Utf8NoBom
          )

      - name: Restore Android signing credentials
        shell: pwsh
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"

          $Required = @{
            ANDROID_KEYSTORE_BASE64 = $env:ANDROID_KEYSTORE_BASE64
            ANDROID_KEY_ALIAS       = $env:ANDROID_KEY_ALIAS
            ANDROID_KEY_PASSWORD    = $env:ANDROID_KEY_PASSWORD
            ANDROID_STORE_PASSWORD  = $env:ANDROID_STORE_PASSWORD
          }

          foreach ($Item in $Required.GetEnumerator()) {
            if ([string]::IsNullOrWhiteSpace($Item.Value)) {
              throw "Missing Android signing secret: $($Item.Key)"
            }
          }

          $KeystorePath = Join-Path $PWD "android\app\homepilot-release.jks"
          [System.IO.File]::WriteAllBytes(
            $KeystorePath,
            [Convert]::FromBase64String($env:ANDROID_KEYSTORE_BASE64)
          )

          $KeyProperties = @(
            "storePassword=$env:ANDROID_STORE_PASSWORD"
            "keyPassword=$env:ANDROID_KEY_PASSWORD"
            "keyAlias=$env:ANDROID_KEY_ALIAS"
            "storeFile=homepilot-release.jks"
          )

          $Utf8NoBom = New-Object System.Text.UTF8Encoding($false)
          [System.IO.File]::WriteAllLines(
            (Join-Path $PWD "android\key.properties"),
            $KeyProperties,
            $Utf8NoBom
          )

      - name: Build and test production APK
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          & ".\tool\build_prod.ps1"

      - name: Verify APK exists
        shell: pwsh
        run: |
          $Apk = Join-Path $PWD "build\app\outputs\flutter-apk\app-release.apk"
          if (-not (Test-Path -LiteralPath $Apk -PathType Leaf)) {
            throw "Production APK was not created: $Apk"
          }
          Get-Item $Apk | Select-Object FullName, Length
          Get-FileHash -LiteralPath $Apk -Algorithm SHA256 | Format-List

      - name: Prepare release files
        id: release
        shell: pwsh
        env:
          VERSION_NAME: ${{ steps.metadata.outputs.version_name }}
          BUILD_NUMBER: ${{ steps.metadata.outputs.build_number }}
          RELEASE_TAG: ${{ steps.metadata.outputs.tag }}
          RELEASE_NAME: ${{ steps.metadata.outputs.release_name }}
          APK_NAME: ${{ steps.metadata.outputs.apk_name }}
        run: |
          $ErrorActionPreference = "Stop"

          $SourceApk = Join-Path $PWD "build\app\outputs\flutter-apk\app-release.apk"
          $ReleaseDirectory = Join-Path $PWD "release"
          New-Item -ItemType Directory -Path $ReleaseDirectory -Force | Out-Null

          $ReleaseApk = Join-Path $ReleaseDirectory $env:APK_NAME
          Copy-Item -LiteralPath $SourceApk -Destination $ReleaseApk -Force
          $Hash = (Get-FileHash -LiteralPath $ReleaseApk -Algorithm SHA256).Hash.ToLowerInvariant()
          $ChecksumFile = "$ReleaseApk.sha256"
          "$Hash  $env:APK_NAME" | Set-Content -LiteralPath $ChecksumFile -Encoding utf8NoBOM

          "version_name=$env:VERSION_NAME" >> $env:GITHUB_OUTPUT
          "build_number=$env:BUILD_NUMBER" >> $env:GITHUB_OUTPUT
          "tag=$env:RELEASE_TAG" >> $env:GITHUB_OUTPUT
          "release_name=$env:RELEASE_NAME" >> $env:GITHUB_OUTPUT
          "apk_name=$env:APK_NAME" >> $env:GITHUB_OUTPUT
          "apk_path=$ReleaseApk" >> $env:GITHUB_OUTPUT
          "checksum_path=$ChecksumFile" >> $env:GITHUB_OUTPUT
          "sha256=$Hash" >> $env:GITHUB_OUTPUT

          Get-Item $ReleaseApk, $ChecksumFile | Select-Object FullName, Length

      - name: Verify package, version, checksum, and signer
        shell: pwsh
        env:
          APK_PATH: ${{ steps.release.outputs.apk_path }}
          APK_NAME: ${{ steps.release.outputs.apk_name }}
          CHECKSUM_PATH: ${{ steps.release.outputs.checksum_path }}
          EXPECTED_SHA256: ${{ steps.release.outputs.sha256 }}
          EXPECTED_VERSION: ${{ steps.release.outputs.version_name }}
          EXPECTED_BUILD: ${{ steps.release.outputs.build_number }}
        run: |
          $ErrorActionPreference = "Stop"
          $ExpectedPackage = "com.homepilot.app"
          $ExpectedSigner = "3E:98:0E:B5:BB:68:A5:19:90:E7:70:56:D4:E1:09:95:B2:E0:4F:B3:88:A7:34:42:B7:9A:46:C8:53:36:1E:51"
          $ExpectedSignerNormalized = ($ExpectedSigner -replace '[^0-9A-Fa-f]', '').ToLowerInvariant()

          $BuildTools = Get-ChildItem (Join-Path $env:ANDROID_HOME "build-tools") -Directory |
            Sort-Object { [version]$_.Name } -Descending |
            Select-Object -First 1
          if (-not $BuildTools) {
            throw "Android build tools were not found."
          }

          $ApkSigner = Join-Path $BuildTools.FullName "apksigner.bat"
          $Aapt2 = Join-Path $BuildTools.FullName "aapt2.exe"
          if (-not (Test-Path $ApkSigner) -or -not (Test-Path $Aapt2)) {
            throw "apksigner or aapt2 was not found in $($BuildTools.FullName)."
          }

          $SignatureOutput = (& $ApkSigner verify --verbose --print-certs $env:APK_PATH 2>&1 | Out-String)
          if ($LASTEXITCODE -ne 0) {
            throw "APK signature verification failed.`n$SignatureOutput"
          }
          if ($SignatureOutput -notmatch '(?:Signer #\d+|V\d+(?:\.\d+)? Signer:)\s+certificate SHA-256 digest:\s*([0-9A-Fa-f:]+)') {
            throw "The APK signer SHA-256 could not be extracted.`n$SignatureOutput"
          }
          $ActualSigner = ($Matches[1] -replace '[^0-9A-Fa-f]', '').ToLowerInvariant()
          if ($ActualSigner -ne $ExpectedSignerNormalized) {
            throw "Unexpected production signer. Expected $ExpectedSigner, got $($Matches[1])."
          }

          $Badging = (& $Aapt2 dump badging $env:APK_PATH 2>&1 | Out-String)
          if ($LASTEXITCODE -ne 0) {
            throw "APK metadata inspection failed.`n$Badging"
          }
          if ($Badging -notmatch "package: name='([^']+)' versionCode='([^']+)' versionName='([^']+)'") {
            throw "Package metadata could not be parsed.`n$Badging"
          }
          $ActualPackage = $Matches[1]
          $ActualBuild = $Matches[2]
          $ActualVersion = $Matches[3]
          if ($ActualPackage -ne $ExpectedPackage) {
            throw "Unexpected package name: $ActualPackage"
          }
          if ($ActualVersion -ne $env:EXPECTED_VERSION) {
            throw "Unexpected version name: $ActualVersion"
          }
          if ($ActualBuild -ne $env:EXPECTED_BUILD) {
            throw "Unexpected version code: $ActualBuild"
          }
          if ($Badging -match '(?m)^application-debuggable') {
            throw "Production APK is marked debuggable."
          }

          $ActualHash = (Get-FileHash -LiteralPath $env:APK_PATH -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($ActualHash -ne $env:EXPECTED_SHA256) {
            throw "APK hash changed after release preparation."
          }
          $ChecksumLine = (Get-Content -LiteralPath $env:CHECKSUM_PATH -Raw).Trim()
          $ExpectedLine = "$($env:EXPECTED_SHA256)  $($env:APK_NAME)"
          if ($ChecksumLine -ne $ExpectedLine) {
            throw "Checksum file contents do not match the release APK."
          }

          Write-Host "Verified package $ActualPackage $ActualVersion ($ActualBuild)."
          Write-Host "Verified signer SHA-256 $ExpectedSigner."
          Write-Host "Verified APK SHA-256 $ActualHash."

      - name: Publish and verify Sentry release
        shell: pwsh
        env:
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_RELEASE: ${{ steps.metadata.outputs.sentry_release }}
          SENTRY_DIST: ${{ steps.metadata.outputs.sentry_dist }}
        run: |
          $ErrorActionPreference = "Stop"
          & ".\tool\publish_sentry_release.ps1" `
            -Release $env:SENTRY_RELEASE `
            -Dist $env:SENTRY_DIST `
            -Environment "prod"

      - name: Upload production APK
        uses: actions/upload-artifact@v7
        with:
          name: HomePilot-production-apk-${{ github.run_number }}
          path: ${{ steps.release.outputs.apk_path }}
          if-no-files-found: error
          retention-days: 30

      - name: Attest production APK provenance
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: ${{ steps.release.outputs.apk_path }}

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          CHANGELOG: ${{ inputs.changelog }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_NAME: ${{ steps.release.outputs.release_name }}
          VERSION_NAME: ${{ steps.release.outputs.version_name }}
          BUILD_NUMBER: ${{ steps.release.outputs.build_number }}
          APK_NAME: ${{ steps.release.outputs.apk_name }}
          APK_PATH: ${{ steps.release.outputs.apk_path }}
          CHECKSUM_PATH: ${{ steps.release.outputs.checksum_path }}
          APK_SHA256: ${{ steps.release.outputs.sha256 }}
          SENTRY_RELEASE: ${{ steps.metadata.outputs.sentry_release }}
        run: |
          $ErrorActionPreference = "Stop"
          if ([string]::IsNullOrWhiteSpace($env:CHANGELOG)) {
            throw "The release changelog cannot be empty."
          }

          & gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            throw "Release already exists: $env:RELEASE_TAG"
          }

          $NotesPath = Join-Path $PWD "release\release-notes.md"
          $Notes = @"
          ## What's changed

          $env:CHANGELOG

          ## Build details

          - Version: $env:VERSION_NAME
          - Build: $env:BUILD_NUMBER
          - Package: com.homepilot.app
          - File: $env:APK_NAME
          - SHA-256: ``$env:APK_SHA256``
          - Signer certificate SHA-256: ``3E:98:0E:B5:BB:68:A5:19:90:E7:70:56:D4:E1:09:95:B2:E0:4F:B3:88:A7:34:42:B7:9A:46:C8:53:36:1E:51``
          - Sentry release: ``$env:SENTRY_RELEASE``

          Verify build provenance with:

          ``````bash
          gh attestation verify $env:APK_NAME --repo $env:GITHUB_REPOSITORY
          ``````
          "@

          $Utf8NoBom = New-Object System.Text.UTF8Encoding($false)
          [System.IO.File]::WriteAllText($NotesPath, $Notes, $Utf8NoBom)

          & gh release create `
            $env:RELEASE_TAG `
            $env:APK_PATH `
            $env:CHECKSUM_PATH `
            --repo $env:GITHUB_REPOSITORY `
            --target $env:GITHUB_SHA `
            --title $env:RELEASE_NAME `
            --notes-file $NotesPath `
            --latest

          if ($LASTEXITCODE -ne 0) {
            throw "GitHub Release creation failed."
          }

      - name: Stop Gradle daemons before cache save
        if: always()
        shell: pwsh
        run: |
          Push-Location "android"
          try {
            & ".\gradlew.bat" --stop
            if ($LASTEXITCODE -ne 0) {
              Write-Warning "Gradle stop returned exit code $LASTEXITCODE."
            }
            Start-Sleep -Seconds 2
          }
          finally {
            Pop-Location
          }

      - name: Remove temporary credentials
        if: always()
        shell: pwsh
        run: |
          Remove-Item -LiteralPath "android\app\homepilot-release.jks" -Force -ErrorAction SilentlyContinue
          Remove-Item -LiteralPath "android\key.properties" -Force -ErrorAction SilentlyContinue
          Remove-Item -LiteralPath "config\prod.json" -Force -ErrorAction SilentlyContinue
